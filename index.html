<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- Makes the website scale correctly on phones and smaller screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROV Build & Test Tracker</title>

  <!-- Connects the CSS stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Website header -->
  <header>
    <h1>ROV Build & Test Tracker</h1>
    <p>Senior Design Project Management</p>
  </header>


  <!-- Main website content -->
  <main>

    <!--
      Controls section
      Contains the button for adding a new project item
      and the category/status filters.
    -->
    <section class="controls">

      <button id="add-item-button">
        + Add Project Item
      </button>


      <!-- Filters used to limit which project items are displayed -->
      <div class="filters">

        <!-- Category filter -->
        <select id="category-filter">
          <option value="all">All Categories</option>
          <option value="Mechanical">Mechanical</option>
          <option value="Electronics">Electronics</option>
          <option value="Camera">Camera</option>
          <option value="Software">Software</option>
          <option value="Waterproofing">Waterproofing</option>
          <option value="Testing">Testing</option>
          <option value="Other">Other</option>
        </select>


        <!-- Status filter -->
        <select id="status-filter">
          <option value="all">All Statuses</option>
          <option value="Planned">Planned</option>
          <option value="In Progress">In Progress</option>
          <option value="Complete">Complete</option>
          <option value="Needs Revision">Needs Revision</option>
        </select>

      </div>

    </section>


    <!--
      Add/Edit form

      The "hidden" class keeps this section hidden until
      the user clicks Add Project Item or Edit.
    -->
    <section id="item-form-section" class="hidden">

      <h2>Add / Edit Project Item</h2>


      <!-- Form used for both adding and editing project items -->
      <form id="item-form">

        <!-- Project title -->
        <label for="title">
          Title
        </label>

        <input
          type="text"
          id="title"
          required
        >


        <!-- Project category -->
        <label for="category">
          Category
        </label>

        <select id="category" required>

          <option value="Mechanical">
            Mechanical
          </option>

          <option value="Electronics">
            Electronics
          </option>

          <option value="Camera">
            Camera
          </option>

          <option value="Software">
            Software
          </option>

          <option value="Waterproofing">
            Waterproofing
          </option>

          <option value="Testing">
            Testing
          </option>

          <option value="Other">
            Other
          </option>

        </select>


        <!-- Project status -->
        <label for="status">
          Status
        </label>

        <select id="status" required>

          <option value="Planned">
            Planned
          </option>

          <option value="In Progress">
            In Progress
          </option>

          <option value="Complete">
            Complete
          </option>

          <option value="Needs Revision">
            Needs Revision
          </option>

        </select>


        <!-- Optional description or project notes -->
        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          rows="4"
          placeholder="Enter project notes or description..."
        ></textarea>


        <!-- Save and cancel buttons -->
        <div class="form-buttons">

          <!-- Submits the form -->
          <button type="submit">
            Save Item
          </button>

          <!-- Closes the form without saving -->
          <button
            type="button"
            id="cancel-button"
          >
            Cancel
          </button>

        </div>

      </form>

    </section>


    <!--
      Project item display area

      JavaScript loads the project items from Supabase
      and inserts their cards inside this div.
    -->
    <section class="project-section">

      <h2>
        Project Items
      </h2>

      <div id="project-items">
      </div>

    </section>

  </main>


  <!--
    Loads the Supabase JavaScript library.
    This lets script.js communicate with our Supabase database.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- Loads our own JavaScript after Supabase has loaded -->
  <script src="script.js"></script>

</body>

</html>
